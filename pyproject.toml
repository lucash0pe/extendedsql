[project]
name = "esql"
version = "1.0.0"
description = "ESQL is a SQL-based query language for OLAP that computes multiple aggregates across groups without nested subqueries or repeated grouping."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Lucas Hope", email = "lucasfhope@icloud.com" },
]
dependencies = [
    "pandas>=2.2.3",
    "numpy>=1.26",
    "beartype>=0.20.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-timeout>=2.3.1",
    "python-dotenv>=1.0",
    "ruff>=0.11.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esql"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long ESQL/SQL query strings that read best on a single line.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/esql"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
